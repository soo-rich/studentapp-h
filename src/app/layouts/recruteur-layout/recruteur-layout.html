<div class="flex min-h-dvh w-full flex-col overflow-x-hidden">
  <mat-toolbar color="primary" class="flex min-h-14 items-center gap-2 px-4">
    <a
      routerLink="/"
      aria-label="Retour à l'accueil"
      class="flex min-h-11 min-w-11 items-center justify-center"
    >
      <mat-icon>home</mat-icon>
    </a>
    <span class="text-base font-medium sm:text-lg">Espace recruteur</span>
  </mat-toolbar>

  <nav
    aria-label="Navigation de l'espace recruteur"
    class="flex w-full flex-wrap items-center gap-1 border-b border-gray-200 bg-white px-2 py-1 sm:px-4"
  >
    <a
      routerLink="/recruteur"
      routerLinkActive="text-blue-700 font-medium"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex min-h-11 items-center px-3 text-sm text-gray-700"
    >
      Tableau de bord
    </a>
    <a
      routerLink="/recruteur/profil"
      routerLinkActive="text-blue-700 font-medium"
      class="flex min-h-11 items-center px-3 text-sm text-gray-700"
    >
      Profil
    </a>
    <a
      routerLink="/recruteur/offres"
      routerLinkActive="text-blue-700 font-medium"
      class="flex min-h-11 items-center px-3 text-sm text-gray-700"
    >
      Offres
    </a>
  </nav>

  <main class="mx-auto w-full max-w-screen-md flex-1 px-4 py-6 sm:px-6 lg:max-w-screen-lg lg:px-8">
    <router-outlet />
  </main>
</div>
